# v2v.yaml - Configuration for the V2X Reinforcement Learning Environment

# -- Simulation Settings --
env_name: "v2v"
episode_duration: 20000
communication_range: 320.0

# -- Vehicle and Attacker Settings --
num_vehicles: 20  # Total number of vehicles, all will be RL-driven
num_attackers: 1
vehicle_resource_mode: 'Combine'
attacker_type: 'Fix' # Use a rule-based attacker as the adversary
use_rl_vehicles: False # This flag makes all 'num_vehicles' RL agents
# load_vehicle_model: False # Whether to load pre-trained models for vehicles
# load_attacker_model: False # Whether to load pre-trained models for attackers
use_pretrained_rl_vehicles: False
rl_vehicle_model_path: "/home/xhl/mywork/harl/examples/results/v2v/my_v2v_env/happo/newTest/newTestRLVehcile/TEST_20RLVEHICLE_1FIX/seed-00042-2025-09-30-16-36-33/models"

rl_vehicle_config_path: "/home/xhl/mywork/harl/examples/results/v2v/my_v2v_env/happo/newTest/newTestRLVehcile/TEST_20RLVEHICLE_1FIX/seed-00042-2025-09-30-16-36-33/config.json"
use_adversarial_attacker: False
# Parameters for the 'Fix' attacker, with explicit policy settings
fix_attacker_params:
  cycle: 20
  num_subchannels: 2
  attack_nearest: False             # Explicitly set the attacker's behavior
  attack_most_and_nearest: False  # Explicitly set the attacker's behavior

# -- Resource Pool and Channel Settings --
num_slots: 60
num_subchannels: 2

# -- SINR Calculation Settings --
use_sinr: True
sinr_threshold: 0.0
tx_power: 23.0
noise_power: -95.0
use_simple_interference: False

# -- RL Agent Settings --


scenario: "my_v2v_env"